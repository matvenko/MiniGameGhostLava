name: iOS TestFlight

# Manual only: Actions tab -> iOS TestFlight -> Run workflow.
# Unity exports the Xcode project on Linux, then a macOS runner signs it and
# uploads it to TestFlight. The build number comes from TestFlight (+1).
on: workflow_dispatch

env:
  IOS_BUNDLE_ID: com.mate-zakariadze.mazeboo

jobs:
  exportXcodeProject:
    name: Export Xcode project (Unity)
    runs-on: ubuntu-latest
    steps:
      # The Unity iOS image plus the project do not fit on a stock runner disk.
      - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ github.sha }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
      - uses: actions/upload-artifact@v4
        with:
          name: build-iOS
          path: build/iOS
          retention-days: 1

  uploadToTestFlight:
    name: Sign and upload to TestFlight
    runs-on: macos-latest
    needs: exportXcodeProject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-iOS
          path: build/iOS
      # Apple only accepts uploads built with its current SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build, sign and upload
        run: |
          xcodebuild -downloadPlatform iOS
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${MATCH_DEPLOY_KEY}"
          find "$IOS_BUILD_PATH" -type f -name "*.sh" -exec chmod +x {} \;
          find "$IOS_BUILD_PATH" -type f -iname "usymtool*" -exec chmod +x {} \;
          bundle exec fastlane ios beta
        env:
          IOS_BUILD_PATH: ${{ github.workspace }}/build/iOS
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Delete the build artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: build-iOS
